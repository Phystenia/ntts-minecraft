pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ntts-voicechat'
include 'common', 'fabric', 'forge'

// NeoForge is currently supported only for Minecraft 1.21.1. Keep it out of
// other version profiles so their Fabric/Forge builds remain unchanged.
def requestedMinecraftVersion = gradle.startParameter.projectProperties
        .getOrDefault('mcVersion', '1.20.1')
if (requestedMinecraftVersion == '1.21.1') {
    include 'neoforge'
}
